[project]
name = "terratwin-backend"
version = "1.0.0"
description = "TerraTwin Earth-Moon-Mars Analog Discovery Platform - Backend API"
authors = [{ name = "TerraTwin Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",
    "httpx>=0.28.0",
    "alembic>=1.14.0",
    "pytest>=8.3.0",
    "python-multipart>=0.0.17",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.1.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
